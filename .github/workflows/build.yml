name: Build VNTM Gamepad IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify Xcode Version
        run: xcodebuild -version
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode Project
        run: xcodegen generate
      
      - name: Build (No Code Sign)
        run: |
          xcodebuild -project VNTMGamepad.xcodeproj \
            -scheme VNTMGamepad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/VNTMGamepad.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      
      - name: Create Normal IPA
        run: |
          mkdir -p build/Payload
          cp -r build/VNTMGamepad.xcarchive/Products/Applications/VNTMGamepad.app build/Payload/
          cd build
          zip -r VNTMGamepad.ipa Payload/
          rm -rf Payload
      
      - name: Create TrollStore TIPA
        run: |
          mkdir -p build/Payload
          cp -r build/VNTMGamepad.xcarchive/Products/Applications/VNTMGamepad.app build/Payload/
          # For TrollStore: ensure no code signature issues
          # Remove any existing code signatures
          find build/Payload -name '_CodeSignature' -type d -exec rm -rf {} + 2>/dev/null || true
          # Create TIPA (TrollStore IPA format)
          cd build
          zip -r VNTMGamepad.tipa Payload/
          rm -rf Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNTMGamepad-IPA
          path: build/VNTMGamepad.ipa
          retention-days: 90
      
      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNTMGamepad-TIPA
          path: build/VNTMGamepad.tipa
          retention-days: 90
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VNTMGamepad.ipa
            build/VNTMGamepad.tipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
